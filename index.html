<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G&I Carousel Tool</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-dark: #1e1e1e;
  --bg-panel: #2a2a2a;
  --bg-input: #333;
  --text-light: #e0e0e0;
  --text-muted: #999;
  --border: #444;
  --accent: #c44b3a;
  --accent-hover: #d65a49;
  --parchment: #f1ebde;
  --ink: #1c1c1c;
  --blue-accent: #4a90d9;
}

body {
  font-family: 'Space Mono', monospace;
  background: var(--bg-dark);
  color: var(--text-light);
  height: 100vh;
  overflow: hidden;
}

/* Layout */
.app-container {
  display: grid;
  grid-template-columns: 380px 1fr;
  height: 100vh;
}

/* Left Panel */
.left-panel {
  background: var(--bg-panel);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.panel-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--accent);
  flex-shrink: 0;
}

/* Accordion */
.accordion-section { border-bottom: 1px solid var(--border); }
.accordion-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 20px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-light);
  user-select: none;
  transition: background 0.15s;
}
.accordion-header:hover { background: rgba(255,255,255,0.04); }
.accordion-header .arrow {
  transition: transform 0.2s;
  font-size: 10px;
  color: var(--text-muted);
}
.accordion-header.active .arrow { transform: rotate(90deg); }
.accordion-body {
  display: none;
  padding: 0 20px 16px;
}
.accordion-body.open { display: block; }

/* Bank */
.cluster-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 12px;
}
.cluster-tab {
  padding: 4px 8px;
  font-size: 10px;
  font-family: 'Space Mono', monospace;
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text-muted);
  cursor: pointer;
  border-radius: 3px;
  transition: all 0.15s;
}
.cluster-tab:hover { border-color: var(--text-muted); color: var(--text-light); }
.cluster-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

.pair-list {
  max-height: 360px;
  overflow-y: auto;
}
.pair-item {
  padding: 8px 10px;
  margin-bottom: 4px;
  font-family: 'Source Serif 4', serif;
  font-size: 12px;
  line-height: 1.5;
  color: var(--text-light);
  background: var(--bg-input);
  border: 1px solid transparent;
  border-radius: 3px;
  cursor: pointer;
  transition: all 0.15s;
}
.pair-item:hover { border-color: var(--accent); }
.pair-item .imp { color: var(--accent); }
.pair-item .gen { color: #7dba6d; }

/* Generate */
.api-key-field, .gen-textarea, .gen-input {
  width: 100%;
  padding: 8px 10px;
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text-light);
  border-radius: 3px;
  margin-bottom: 8px;
  outline: none;
}
.api-key-field:focus, .gen-textarea:focus, .gen-input:focus { border-color: var(--accent); }
.gen-textarea { resize: vertical; min-height: 60px; }

.gen-row { display: flex; gap: 8px; margin-bottom: 8px; }
.gen-row select {
  flex: 1;
  padding: 8px;
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text-light);
  border-radius: 3px;
}

.btn {
  padding: 8px 16px;
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  border: none;
  border-radius: 3px;
  cursor: pointer;
  transition: all 0.15s;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary { background: var(--bg-input); color: var(--text-light); border: 1px solid var(--border); }
.btn-secondary:hover { border-color: var(--text-muted); }

.candidates-list { margin-top: 12px; }
.candidate-item {
  padding: 10px;
  margin-bottom: 6px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 3px;
  cursor: pointer;
  transition: border-color 0.15s;
}
.candidate-item:hover { border-color: var(--accent); }
.candidate-item .c-imp { font-family: 'Source Serif 4', serif; color: var(--accent); font-size: 12px; }
.candidate-item .c-gen { font-family: 'Source Serif 4', serif; color: #7dba6d; font-size: 12px; }
.candidate-item .c-mech { font-size: 11px; color: var(--text-muted); margin-top: 6px; line-height: 1.4; }

/* Load JSON */
.json-textarea {
  width: 100%;
  min-height: 120px;
  padding: 8px 10px;
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text-light);
  border-radius: 3px;
  resize: vertical;
  margin-bottom: 8px;
}

/* Right Panel */
.right-panel {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Editor */
.editor-section {
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  background: var(--bg-panel);
}
.editor-row {
  display: flex;
  gap: 12px;
  margin-bottom: 10px;
  align-items: flex-start;
}
.editor-field { flex: 1; }
.editor-field.small { flex: 0 0 100px; }
.editor-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
  margin-bottom: 4px;
}
.editor-input, .editor-textarea-field {
  width: 100%;
  padding: 8px 10px;
  font-family: 'Source Serif 4', serif;
  font-size: 13px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text-light);
  border-radius: 3px;
  outline: none;
}
.editor-input:focus, .editor-textarea-field:focus { border-color: var(--accent); }
.editor-textarea-field { resize: vertical; min-height: 80px; font-size: 12px; line-height: 1.6; }

.underline-hint {
  font-size: 9px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* Preview */
.preview-section {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
  background: var(--bg-dark);
}

.preview-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 16px;
}

.export-bar {
  display: flex;
  gap: 10px;
  padding: 12px 24px;
  background: var(--bg-panel);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

/* Slide Styles */
.slide-wrapper {
  aspect-ratio: 4/5;
  position: relative;
  cursor: pointer;
  border-radius: 4px;
  overflow: hidden;
  box-shadow: 0 2px 12px rgba(0,0,0,0.4);
}

.slide {
  width: 100%;
  height: 100%;
  background: var(--parchment);
  position: relative;
  display: flex;
  flex-direction: column;
  font-family: 'Source Serif 4', serif;
  color: var(--ink);
}

/* Lined paper */
.slide::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(
    to bottom,
    transparent,
    transparent calc(1em * 1.8 - 1px),
    #c9bfae calc(1em * 1.8 - 1px),
    #c9bfae calc(1em * 1.8)
  );
  background-size: 100% 1.8em;
  background-position: 0 0;
  opacity: 0.35;
  pointer-events: none;
  z-index: 0;
}

/* Red margin rule */
.slide::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  left: 10%;
  width: 1.5px;
  background: var(--accent);
  opacity: 0.3;
  pointer-events: none;
  z-index: 0;
}

.slide-content {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  height: 100%;
  padding: 8% 10% 6% 14%;
}

/* Header */
.slide-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: auto;
  flex-shrink: 0;
}
.field-note-label {
  font-family: 'Space Mono', monospace;
  font-size: 0.55em;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #666;
}

/* Stamp */
.stamp {
  border: 2px solid var(--accent);
  border-radius: 4px;
  padding: 0.2em 0.5em;
  font-family: 'Space Mono', monospace;
  font-size: 0.42em;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--accent);
  text-align: center;
  line-height: 1.3;
  transform: rotate(2deg);
  flex-shrink: 0;
  white-space: nowrap;
}

/* Body */
.slide-body {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 2%;
}

.statement-text {
  font-size: 1.3em;
  font-weight: 600;
  line-height: 1.45;
  text-align: center;
  color: var(--ink);
}
.statement-text .underline-word {
  text-decoration: underline;
  text-decoration-color: var(--accent);
  text-underline-offset: 4px;
  text-decoration-thickness: 2px;
}

.mechanism-text {
  font-size: 0.72em;
  line-height: 1.75;
  color: var(--ink);
  text-align: left;
}
.mechanism-text .red-em {
  color: var(--accent);
  font-style: italic;
}
.mechanism-text .bold-text {
  font-weight: 600;
}

/* CTA slide body */
.cta-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5%;
}

.book-cover-img {
  width: 70%;
  height: auto;
  object-fit: contain;
}

.cta-text {
  font-family: 'Source Serif 4', serif;
  font-size: 0.55em;
  color: var(--ink);
  text-align: center;
  line-height: 1.6;
}
.cta-text .cta-line2 {
  font-family: 'Space Mono', monospace;
  font-size: 0.85em;
  letter-spacing: 0.05em;
  color: var(--accent);
}

/* Footer */
.slide-footer {
  border-top: 1px dashed #999;
  padding-top: 0.3em;
  font-family: 'Space Mono', monospace;
  font-size: 0.38em;
  color: #888;
  letter-spacing: 0.04em;
  text-align: right;
  flex-shrink: 0;
}

/* Export render container (hidden) */
.export-render {
  position: fixed;
  left: -9999px;
  top: 0;
}
.export-render .slide-wrapper {
  width: 1080px;
  height: 1350px;
}

/* Spinner */
.spinner {
  display: inline-block;
  width: 14px; height: 14px;
  border: 2px solid var(--text-muted);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #777; }

.status-msg {
  font-size: 11px;
  color: var(--text-muted);
  padding: 8px 0;
}
.status-msg.error { color: var(--accent); }
</style>
</head>
<body>

<div class="app-container">
  <!-- LEFT PANEL -->
  <div class="left-panel">
    <div class="panel-header">G&I Carousel Tool</div>

    <!-- Statement Bank -->
    <div class="accordion-section">
      <div class="accordion-header active" onclick="toggleAccordion(this)">
        <span>Statement Bank</span><span class="arrow">&#9654;</span>
      </div>
      <div class="accordion-body open">
        <div class="cluster-tabs" id="clusterTabs"></div>
        <div class="pair-list" id="pairList"></div>
      </div>
    </div>

    <!-- Generate -->
    <div class="accordion-section">
      <div class="accordion-header" onclick="toggleAccordion(this)">
        <span>Generate (Claude API)</span><span class="arrow">&#9654;</span>
      </div>
      <div class="accordion-body">
        <input type="password" class="api-key-field" id="apiKey" placeholder="API key (stored in session only)">
        <textarea class="gen-textarea" id="genPrompt" placeholder="Topic or angle (e.g. 'creativity', 'parenting', 'studying for exams')"></textarea>
        <div class="gen-row">
          <select id="genCluster">
            <option value="">Any cluster</option>
          </select>
          <button class="btn btn-primary" id="genBtn" onclick="generatePairs()">Generate</button>
        </div>
        <div id="genStatus"></div>
        <div class="candidates-list" id="candidatesList"></div>
      </div>
    </div>

    <!-- Load JSON -->
    <div class="accordion-section">
      <div class="accordion-header" onclick="toggleAccordion(this)">
        <span>Load JSON</span><span class="arrow">&#9654;</span>
      </div>
      <div class="accordion-body">
        <textarea class="json-textarea" id="jsonInput" placeholder='Paste JSON here...'></textarea>
        <button class="btn btn-secondary" onclick="loadJSON()">Load</button>
        <div id="jsonStatus" class="status-msg"></div>
      </div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">
    <!-- Editor -->
    <div class="editor-section">
      <div class="editor-row">
        <div class="editor-field small">
          <div class="editor-label">Field Note #</div>
          <input type="number" class="editor-input" id="edFieldNote" value="1" min="1" oninput="updatePreview()">
        </div>
        <div class="editor-field">
          <div class="editor-label">Impostor Statement</div>
          <input type="text" class="editor-input" id="edImpostor" placeholder="Your Impostor..." oninput="updatePreview()">
          <div class="underline-hint">Underline word: <input type="text" class="editor-input" id="edImpUnderline" placeholder="word" style="width:120px;display:inline;padding:3px 6px;font-size:11px;" oninput="updatePreview()"></div>
        </div>
        <div class="editor-field">
          <div class="editor-label">Genius Statement</div>
          <input type="text" class="editor-input" id="edGenius" placeholder="Your Genius..." oninput="updatePreview()">
          <div class="underline-hint">Underline word: <input type="text" class="editor-input" id="edGenUnderline" placeholder="word" style="width:120px;display:inline;padding:3px 6px;font-size:11px;" oninput="updatePreview()"></div>
        </div>
      </div>
      <div class="editor-row">
        <div class="editor-field">
          <div class="editor-label">Mechanism (use *italic* for red, **bold** for emphasis)</div>
          <textarea class="editor-textarea-field" id="edMechanism" placeholder="When you make a mistake, your brain has options..." oninput="updatePreview()"></textarea>
        </div>
      </div>
      <div class="editor-row">
        <div class="editor-field small" style="flex:0 0 140px;">
          <div class="editor-label">CTA Stamp</div>
          <input type="text" class="editor-input" id="edCtaStamp" value="Forthcoming" oninput="updatePreview()">
        </div>
        <div class="editor-field">
          <div class="editor-label">CTA Line 1</div>
          <input type="text" class="editor-input" id="edCtaLine1" value="Available for pre-order at GeniusAndImpostor.com" oninput="updatePreview()">
        </div>
        <div class="editor-field">
          <div class="editor-label">CTA Line 2 (optional)</div>
          <input type="text" class="editor-input" id="edCtaLine2" value="" placeholder="Optional second line" oninput="updatePreview()">
        </div>
      </div>
    </div>

    <!-- Preview -->
    <div class="preview-section" id="previewSection">
      <div class="preview-grid" id="previewGrid"></div>
    </div>

    <!-- Export Bar -->
    <div class="export-bar">
      <button class="btn btn-primary" onclick="exportAll()">Download All PNGs</button>
      <button class="btn btn-secondary" onclick="copyJSON()">Copy JSON</button>
      <span id="exportStatus" class="status-msg" style="align-self:center;margin-left:8px;"></span>
    </div>
  </div>
</div>

<!-- Hidden export render container -->
<div class="export-render" id="exportRender"></div>

<script>
// ============================================================
// STATEMENT BANK

function toggleAccordion(header) {
  const wasActive = header.classList.contains('active');
  // Close all
  document.querySelectorAll('.accordion-header').forEach(h => {
    h.classList.remove('active');
    h.nextElementSibling.classList.remove('open');
  });
  if (!wasActive) {
    header.classList.add('active');
    header.nextElementSibling.classList.add('open');
  }
}

// BANK UI
// ============================================================
let activeCluster = CLUSTER_NAMES[0];

function buildClusterTabs() {
  const container = document.getElementById('clusterTabs');
  const select = document.getElementById('genCluster');
  CLUSTER_NAMES.forEach((name, i) => {
    // Tabs
    const tab = document.createElement('span');
    tab.className = 'cluster-tab' + (i === 0 ? ' active' : '');
    tab.textContent = (i + 1) + '. ' + name.split(' ').slice(0, 2).join(' ');
    tab.title = name;
    tab.onclick = () => {
      activeCluster = name;
      document.querySelectorAll('.cluster-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      buildPairList();
    };
    container.appendChild(tab);

    // Select option
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = (i + 1) + '. ' + name;
    select.appendChild(opt);
  });
}

function buildPairList() {
  const container = document.getElementById('pairList');
  container.innerHTML = '';
  const pairs = BANK[activeCluster] || [];
  pairs.forEach(([imp, gen]) => {
    const div = document.createElement('div');
    div.className = 'pair-item';
    div.innerHTML = `<span class="imp">${esc(imp)}</span><br><span class="gen">${esc(gen)}</span>`;
    div.onclick = () => loadPairFromBank(imp, gen);
    container.appendChild(div);
  });
}

function loadPairFromBank(imp, gen) {
  // Bank lines already start with "The Impostor/Genius" — prepend "Your" only on that prefix
  document.getElementById('edImpostor').value = imp.replace(/^The Impostor/, 'Your Impostor');
  document.getElementById('edGenius').value = gen.replace(/^The Genius/, 'Your Genius');
  // Auto-detect underline words (last meaningful word)
  document.getElementById('edImpUnderline').value = guessUnderline(imp);
  document.getElementById('edGenUnderline').value = guessUnderline(gen);
  document.getElementById('edMechanism').value = '';
  updatePreview();
}

function guessUnderline(statement) {
  // Pick the last word before the period, excluding common words
  const words = statement.replace(/[."]/g, '').split(/\s+/);
  if (words.length === 0) return '';
  // Return last word
  return words[words.length - 1].toLowerCase();
}

function loadJSON() {
  const status = document.getElementById('jsonStatus');
  try {
    const raw = document.getElementById('jsonInput').value.trim();
    const data = JSON.parse(raw);
    if (data.impostor) document.getElementById('edImpostor').value = data.impostor;
    if (data.genius) document.getElementById('edGenius').value = data.genius;
    if (data.mechanism) document.getElementById('edMechanism').value = data.mechanism;
    if (data.fieldNoteNumber) document.getElementById('edFieldNote').value = data.fieldNoteNumber;
    if (data.underlineWord) document.getElementById('edImpUnderline').value = data.underlineWord;
    if (data.geniusUnderlineWord) document.getElementById('edGenUnderline').value = data.geniusUnderlineWord;
    if (data.ctaStamp) document.getElementById('edCtaStamp').value = data.ctaStamp;
    if (data.ctaLine1) document.getElementById('edCtaLine1').value = data.ctaLine1;
    if (data.ctaLine2) document.getElementById('edCtaLine2').value = data.ctaLine2;
    updatePreview();
    status.textContent = 'Loaded.';
    status.className = 'status-msg';
  } catch (e) {
    status.textContent = 'Invalid JSON: ' + e.message;
    status.className = 'status-msg error';
  }
}

async function generatePairs() {
  const key = getApiKey();
  if (!key) { alert('Enter an API key.'); return; }

  const topic = document.getElementById('genPrompt').value.trim();
  if (!topic) { alert('Enter a topic or angle.'); return; }

  const cluster = document.getElementById('genCluster').value;
  const btn = document.getElementById('genBtn');
  const statusEl = document.getElementById('genStatus');
  const listEl = document.getElementById('candidatesList');

  btn.disabled = true;
  statusEl.innerHTML = '<span class="spinner"></span> Generating...';
  listEl.innerHTML = '';

  const clusterCtx = cluster ? `\nFocus on the "${cluster}" cluster if possible, but don't force it.` : '';

  const systemPrompt = `You are a writer for "The Genius and the Impostor" by Josh Turknett, MD. You generate contrast pairs for Instagram carousels.

The framework: Every brain has two systems. The Impostor is the conscious self-monitoring module — it manages reputation, status, and social standing. The Genius is the vast unconscious learning system that actually builds capability. The Impostor hijacks performance under pressure; the Genius does the real work.

Rules for pairs:
- Impostor line first, Genius line second
- Format: "The Impostor [verb/action]." / "The Genius [verb/action]."
- The strongest pairs: the Genius line is not just the opposite but a quiet reframe
- Surprise on the Genius side does most of the work
- Concrete beats abstract
- Watch for false parallelism and for the Impostor line being more vivid than the Genius line
- Plain language for a smart non-scientist
- No wellness language, no biohacker tone
- Never equate IQ with intelligence
- "Built through work" — universal claim, no exceptions
- Clarity over cleverness — no "It's not X, it's Y" inversions
- Lines should feel like field notes from studying human performance, not motivational posters

For each pair, also write a 2-3 paragraph mechanism explanation (60-100 words total) that:
- Explains WHY this contrast exists neurologically/psychologically
- Uses plain language
- References brain systems only when accurate
- Wraps *key phrases* in single asterisks for emphasis (these render in red)
${clusterCtx}

Return ONLY valid JSON, an array of 3-5 objects:
[{"impostor":"The Impostor ...","genius":"The Genius ...","mechanism":"...","underlineWord":"...","geniusUnderlineWord":"..."}]

underlineWord = the key word in the impostor line to visually emphasize
geniusUnderlineWord = the key word in the genius line to visually emphasize`;

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 2048,
        system: systemPrompt,
        messages: [{
          role: 'user',
          content: `Generate Genius/Impostor contrast pairs about: ${topic}`
        }]
      })
    });

    if (!resp.ok) {
      const err = await resp.text();
      throw new Error(`API ${resp.status}: ${err.substring(0, 200)}`);
    }

    const data = await resp.json();
    const text = data.content[0].text;

    // Extract JSON from response
    let candidates;
    const jsonMatch = text.match(/\[[\s\S]*\]/);
    if (jsonMatch) {
      candidates = JSON.parse(jsonMatch[0]);
    } else {
      throw new Error('No JSON array found in response');
    }

    statusEl.textContent = `${candidates.length} candidates generated.`;
    candidates.forEach((c, i) => {
      const div = document.createElement('div');
      div.className = 'candidate-item';
      div.innerHTML = `
        <div class="c-imp">${esc(c.impostor)}</div>
        <div class="c-gen">${esc(c.genius)}</div>
        <div class="c-mech">${esc((c.mechanism || '').substring(0, 150))}...</div>
      `;
      div.onclick = () => {
        document.getElementById('edImpostor').value = c.impostor;
        document.getElementById('edGenius').value = c.genius;
        document.getElementById('edMechanism').value = c.mechanism || '';
        document.getElementById('edImpUnderline').value = c.underlineWord || '';
        document.getElementById('edGenUnderline').value = c.geniusUnderlineWord || '';
        updatePreview();
      };
      listEl.appendChild(div);
    });
  } catch (e) {
    statusEl.innerHTML = `<span class="error">${esc(e.message)}</span>`;
  } finally {
    btn.disabled = false;
  }
}

// ============================================================
// PREVIEW RENDERING
// ============================================================
function esc(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function renderStatement(text, underlineWord) {
  if (!underlineWord || !text) return esc(text || '');
  const escaped = esc(text);
  const word = underlineWord.trim();
  // Case-insensitive replacement of the word
  const regex = new RegExp(`(${word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'i');
  return escaped.replace(regex, '<span class="underline-word">$1</span>');
}

function renderMechanism(text) {
  if (!text) return '';
  let html = esc(text);
  // Convert \n to <br>
  html = html.replace(/\n/g, '<br>');
  // Bold: **text**
  html = html.replace(/\*\*(.+?)\*\*/g, '<span class="bold-text">$1</span>');
  // Italic/red: *text*
  html = html.replace(/\*(.+?)\*/g, '<span class="red-em">$1</span>');
  return html;
}

function getEditorState() {
  return {
    noteNum: parseInt(document.getElementById('edFieldNote').value) || 1,
    impostor: document.getElementById('edImpostor').value,
    genius: document.getElementById('edGenius').value,
    mechanism: document.getElementById('edMechanism').value,
    impUL: document.getElementById('edImpUnderline').value,
    genUL: document.getElementById('edGenUnderline').value,
    ctaStamp: document.getElementById('edCtaStamp').value,
    ctaLine1: document.getElementById('edCtaLine1').value,
    ctaLine2: document.getElementById('edCtaLine2').value
  };
}

function updatePreview() {
  const s = getEditorState();
  const grid = document.getElementById('previewGrid');
  let html = '';
  for (let i = 0; i < 4; i++) {
    html += buildSlideHTML(i, s.noteNum, s.impostor, s.genius, s.mechanism, s.impUL, s.genUL, s.ctaStamp, s.ctaLine1, s.ctaLine2);
  }
  grid.innerHTML = html;
}

// ============================================================
// EXPORT
// ============================================================
async function exportAll() {
  const statusEl = document.getElementById('exportStatus');
  statusEl.innerHTML = '<span class="spinner"></span> Rendering...';

  const s = getEditorState();
  const renderContainer = document.getElementById('exportRender');
  const slideNames = ['hook', 'reveal', 'mechanism', 'cta'];
  const blobs = [];

  // Wait for fonts first
  await document.fonts.ready;

  for (let i = 0; i < 4; i++) {
    statusEl.innerHTML = `<span class="spinner"></span> Rendering slide ${i + 1} of 4...`;

    renderContainer.innerHTML = buildSlideHTML(i, s.noteNum, s.impostor, s.genius, s.mechanism, s.impUL, s.genUL, s.ctaStamp, s.ctaLine1, s.ctaLine2);

    const wrapper = renderContainer.querySelector('.slide-wrapper');
    // Override aspect-ratio and set fixed dimensions
    wrapper.style.cssText = 'width:1080px;height:1350px;aspect-ratio:auto;border-radius:0;overflow:hidden;position:relative;box-shadow:none;cursor:default;';

    const slide = wrapper.querySelector('.slide');
    // Base font for 1080px wide. Preview is ~250px, so scale ~4.3x from default
    slide.style.fontSize = '48px';

    // Let layout settle
    await new Promise(r => setTimeout(r, 200));

    try {
      const canvas = await html2canvas(wrapper, {
        width: 1080,
        height: 1350,
        scale: 1,
        useCORS: true,
        backgroundColor: '#f1ebde',
        logging: false,
        allowTaint: true
      });

      // Convert to blob and store
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
      const filename = `field-note-${String(s.noteNum).padStart(2, '0')}-${String(i + 1).padStart(2, '0')}-${slideNames[i]}.png`;
      blobs.push({ blob, filename });
    } catch (e) {
      statusEl.textContent = 'Export error on slide ' + (i + 1) + ': ' + e.message;
      statusEl.className = 'status-msg error';
      renderContainer.innerHTML = '';
      return;
    }
  }

  renderContainer.innerHTML = '';

  // Package into zip
  statusEl.innerHTML = '<span class="spinner"></span> Packaging zip...';
  const zip = new JSZip();
  for (const { blob, filename } of blobs) {
    zip.file(filename, blob);
  }
  const zipBlob = await zip.generateAsync({ type: 'blob' });
  const url = URL.createObjectURL(zipBlob);
  const link = document.createElement('a');
  link.download = `field-note-${String(s.noteNum).padStart(2, '0')}.zip`;
  link.href = url;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);

  statusEl.textContent = `${blobs.length} slides exported.`;
  statusEl.className = 'status-msg';
}

function copyJSON() {
  const s = getEditorState();
  const data = {
    fieldNoteNumber: s.noteNum,
    impostor: s.impostor,
    genius: s.genius,
    mechanism: s.mechanism,
    underlineWord: s.impUL,
    geniusUnderlineWord: s.genUL,
    ctaStamp: s.ctaStamp,
    ctaLine1: s.ctaLine1,
    ctaLine2: s.ctaLine2
  };
  navigator.clipboard.writeText(JSON.stringify(data, null, 2)).then(() => {
    document.getElementById('exportStatus').textContent = 'JSON copied.';
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = JSON.stringify(data, null, 2);
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    document.getElementById('exportStatus').textContent = 'JSON copied.';
  });
}

// INIT
// ============================================================
buildClusterTabs();
buildPairList();
updatePreview();
